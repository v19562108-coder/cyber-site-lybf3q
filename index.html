<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выгул Драконов</title>
    <style>
        body { font-family: 'Futura', sans-serif; background: #f5f5f5; }
        .dragon { width: 200px; height: 200px; background: #785443; margin: 20px; display: inline-block; }
        .emoji { font-size: 3em; cursor: pointer; position: fixed; bottom: 20px; right: 20px; }
        .emoji:hover { transform: scale(1.2); }
    </style>
</head>
<body>
    <header>
        <h1>Выгул Драконов</h1>
    </header>
    <main>
        <div class="dragon">🐉</div>
        <div class="dragon">🐉</div>
        <div class="dragon">🐉</div>
        <div class="dragon">🐉</div>
    </main>
    <footer>
        <button class="emoji" onclick="alert('Ты погладил дракона!'); this.style.transform='translate(200px, 200px)'">Погладить дракона 🐉</button>
    </footer>
    <script>
        const cat = document.querySelector('.emoji');
        cat.addEventListener('mousemove', (event) => {
            cat.style.transform = `translate(${event.clientX}px, ${event.clientY}px)`;
        });
    </script>
</body>
</html>
